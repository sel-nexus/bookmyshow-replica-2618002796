services:
  backend:
    build: ./backend
    environment:
      PORT: 3001
      DATABASE_PATH: /data/bookings.sqlite
      SESSION_SECRET: development-session-secret-change-me
      SESSION_COOKIE_NAME: bms_session
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
    volumes:
      - sqlite-data:/data
    ports:
      - "3001:3001"
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      BACKEND_ORIGIN: http://backend:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  sqlite-data:
